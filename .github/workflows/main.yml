name: Sync Fork
on:
  schedule:
    - cron: "17 8 * * *"
      timezone: Asia/Shanghai    # 每天 08:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 获取完整历史

      - name: Safe sync with upstream
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"

          # 1. 备份你的 workflows 目录到临时文件夹（防止被覆盖或删除）
          mkdir -p /tmp/my_workflows
          cp -r .github/workflows/* /tmp/my_workflows/ || true

          # 2. 添加上游源并拉取原作者的代码
          git remote add upstream https://github.com/opa334/TrollStore.git || true
          git fetch upstream

          # 3. 合并上游代码（允许无关历史，冲突优先采用原作者代码）
          git checkout main
          git merge upstream/main --allow-unrelated-histories -X theirs -m "Auto sync from upstream" || true

          # 4. 恢复你的 workflows 目录（把你自己的文件覆盖回来）
          mkdir -p .github/workflows
          cp -r /tmp/my_workflows/* .github/workflows/ || true

          # 5. 强制添加并提交你的 workflows
          git add -f .github/workflows/
          git commit -m "Preserve my workflows [skip ci]" || true
          
          # 6. 推送到你的仓库
          git push origin main || true
