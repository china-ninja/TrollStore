name: Sync Fork
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # 获取完整历史
          
      - name: Safe sync with upstream
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git remote add upstream https://github.com/opa334/TrollStore.git || true
          git fetch upstream
          # 切换到 main 分支并尝试合并（而不是强制重置）
          git checkout main
          # 允许合并无关历史，如果遇到冲突则采用原作者的代码（-X theirs）
          git merge upstream/main --allow-unrelated-histories -X theirs -m "Auto sync from upstream" || true
          # 重新把我们的 workflow 文件加回来（如果被合并覆盖了）
          mkdir -p .github/workflows
          git add .github/workflows/ || true
          git commit -m "Preserve workflows [skip ci]" || true
          # 推送到你的仓库
          git push origin main
