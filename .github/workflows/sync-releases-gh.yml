name: Sync All Releases

on:
  schedule:
    - cron: '0 0 * * *' # 每天检查一次
  workflow_dispatch:     # 支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整的标签历史

      - name: Sync all upstream tags
        run: |
          # 把原仓库的所有 git tag 同步到你的仓库
          git remote add upstream https://github.com/opa334/TrollStore.git || true
          git fetch upstream --tags --force
          git push origin --tags --force || true

      - name: Sync all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 获取所有 Release 的 tag 列表
          TAGS=$(gh release list --repo opa334/TrollStore --limit 100 --json tagName --jq '.[].tagName')
          
          if [ -z "$TAGS" ]; then
            echo "原仓库没有找到任何 Release。"
            exit 0
          fi

          for TAG in $TAGS; do
            echo "=========================================="
            echo "开始处理 Release: $TAG"
            
            # 获取原 release 的说明 (body)
            BODY=$(gh release view "$TAG" --repo opa334/TrollStore --json body --jq '.body' || echo "同步自 opa334/TrollStore")
            
            # 下载附件
            mkdir -p "assets/$TAG"
            gh release download "$TAG" --repo opa334/TrollStore --dir "assets/$TAG" || true
            
            # 检查本地是否已有这个 Release
            if gh release view "$TAG" --repo china-ninja/TrollStore > /dev/null 2>&1; then
              echo "本地 Release 已存在，更新说明和附件..."
              gh release edit "$TAG" --repo china-ninja/TrollStore --notes "$BODY"
            else
              echo "本地 Release 不存在，创建新 Release..."
              gh release create "$TAG" --repo china-ninja/TrollStore --title "$TAG" --notes "$BODY" --target main
            fi
            
            # 上传附件（如果有）
            if [ -n "$(ls -A assets/$TAG 2>/dev/null)" ]; then
              echo "上传附件..."
              gh release upload "$TAG" assets/$TAG/* --repo china-ninja/TrollStore --clobber
            else
              echo "该版本无附件，跳过。"
            fi
          done
